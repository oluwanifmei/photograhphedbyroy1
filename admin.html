<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Photographed by Roy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="forms.css">
  
</head>
<body>
  <main class="admin-page">
    <div class="form-logo">
      <a href="index.html">
        <span class="brand-mark">R</span>
      </a>
    </div>
    <h1>Admin Portal</h1>
    <p>View signups and booking requests (stored locally in this demo).</p>
    
    <div class="admin-login-block">
      <div class="form-group">
        <label for="adminEmail">Admin Email</label>
        <input id="adminEmail" placeholder="admin@example.com" />
      </div>
      <div class="form-group">
        <label for="adminPassword">Admin Password</label>
        <input id="adminPassword" type="password" placeholder="••••••••" />
      </div>
      <div class="form-actions">
        <button id="adminLogin" class="button button-primary">Login as Admin</button>
      </div>
    </div>
    
    <section class="admin-section">
      <h2>Registered Signups</h2>
      <ul id="signupList"></ul>
    </section>
    
    <section class="admin-section">
      <h2>Booking Requests</h2>
      <ul id="bookingList"></ul>
    </section>
    
    <p class="return-home"><a href="index.html">← Return to home</a></p>
  </main>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
