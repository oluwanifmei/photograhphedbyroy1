<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Photographed by Roy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="forms.css">
</head>
<body>
  <main class="form-page">
    <div class="form-logo">
      <a href="index.html">
        <span class="brand-mark">R</span>
      </a>
    </div>
    <h1>Login</h1>
    <p>Sign in to your account to request and manage bookings.</p>
    
    <form id="loginForm" class="booking-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="button button-primary">Login</button>
        <a class="button button-secondary" href="signup.html">Create Account</a>
      </div>
    </form>
    
    <p class="return-home"><a href="index.html">← Return to home</a></p>
  </main>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
